<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Favicon before and after</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        color: var(--foreground, #252b35);
      }
      * {
        box-sizing: border-box;
      }
      .comparison {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      article {
        min-width: 0;
      }
      h2 {
        font-size: 16px;
        margin: 0 0 12px;
      }
      .stage {
        background: #edf0f3;
        border: 1px solid #d1d6dd;
        border-radius: 12px;
        padding: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 180px;
      }
      .hero {
        width: 128px;
        height: 128px;
        object-fit: contain;
      }
      .tab {
        margin-top: 12px;
        padding: 16px;
        background: #edf0f3;
        color: #2b2f36;
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
      }
      .tab.dark {
        background: #252930;
        color: #f6f7f9;
      }
      .tab img {
        width: 16px;
        height: 16px;
      }
      .sizes {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 16px;
        height: 52px;
      }
      .sizes span {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        color: var(--muted-foreground, #667);
      }
      p {
        font-size: 13px;
        line-height: 1.5;
        color: var(--muted-foreground, #667);
        margin: 14px 0 0;
      }
      @media (max-width: 450px) {
        .comparison {
          gap: 12px;
        }
        .stage {
          padding: 16px;
          min-height: 150px;
        }
        .hero {
          width: 108px;
          height: 108px;
        }
        .sizes {
          gap: 8px;
          flex-wrap: wrap;
          height: auto;
        }
        .sizes span {
          flex-direction: column;
        }
        .tab {
          font-size: 12px;
          padding: 16px;
          gap: 6px;
        }
      }
    </style>
  </head>
