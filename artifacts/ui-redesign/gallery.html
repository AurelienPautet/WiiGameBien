<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;color:var(--foreground,#263039);font-family:var(--font-sans,system-ui);background:transparent}*{box-sizing:border-box}.controls{display:flex;align-items:center;gap:8px;margin-bottom:12px}select{min-width:0;flex:1;font:inherit;font-size:14px;color:var(--foreground,#263039);background:var(--card,#fff);padding:10px;border:1px solid var(--border,#ccc);border-radius:8px}button{font:inherit;border:1px solid var(--border,#ccc);background:var(--card,#fff);color:var(--foreground,#263039);padding:10px 13px;border-radius:8px;cursor:pointer}button:disabled{opacity:.4;cursor:default}figure{margin:0}figure[hidden]{display:none}img{display:block;max-width:100%;width:auto;max-height:720px;height:auto;margin:0 auto;border-radius:10px}figcaption{font-size:13px;line-height:1.5;color:var(--muted-foreground,#626b76);margin:12px 0 0}#count{font-size:12px;white-space:nowrap;color:var(--muted-foreground,#626b76)}button:focus-visible,select:focus-visible{outline:3px solid var(--primary,#00b2e1);outline-offset:2px}
</style></head><body><div class="controls"><select aria-label="Screenshot" id="screen"><option value="0">Home · campaign featured</option><option value="1">Home · multiplayer featured</option><option value="2">Solo levels</option><option value="3">Rankings</option><option value="4">Admin</option><option value="5">Level editor</option><option value="6">Campaign editor</option><option value="7">Home · wide desktop</option><option value="8">Home · mobile</option><option value="9">Campaign selector</option><option value="10">Multiplayer selector</option><option value="11">My levels</option><option value="12">My campaigns</option></select><button id="prev" aria-label="Previous screenshot">←</button><button id="next" aria-label="Next screenshot">→</button><span id="count"></span></div><figure data-screen="0" ><img src="26-home-player-card.png" alt="Home · campaign featured screenshot"><figcaption>Fewer than 100 connected players: the yellow campaign card takes the lead.</figcaption></figure><figure data-screen="1" hidden><img src="29-home-multiplayer-player-card.png" alt="Home · multiplayer featured screenshot"><figcaption>100 or more connected players: multiplayer moves into the green feature card.</figcaption></figure><figure data-screen="2" hidden><img src="03-solo.png" alt="Solo levels screenshot"><figcaption>Existing solo browser with the shared sidebar.</figcaption></figure><figure data-screen="3" hidden><img src="04-rankings.png" alt="Rankings screenshot"><figcaption>Existing rankings page with the shared sidebar.</figcaption></figure><figure data-screen="4" hidden><img src="05-admin.png" alt="Admin screenshot"><figcaption>Existing dashboard with the shared sidebar.</figcaption></figure><figure data-screen="5" hidden><img src="06-level-editor.png" alt="Level editor screenshot"><figcaption>Existing editor fitted into the space beside the sidebar.</figcaption></figure><figure data-screen="6" hidden><img src="07-campaign-editor.png" alt="Campaign editor screenshot"><figcaption>Existing campaign editor with the shared sidebar.</figcaption></figure><figure data-screen="7" hidden><img src="27-home-wide-player-card.png" alt="Home · wide desktop screenshot"><figcaption>The home fills the available space, with the footer centered across the full page at the bottom.</figcaption></figure><figure data-screen="8" hidden><img src="28-home-mobile-player-card.png" alt="Home · mobile screenshot"><figcaption>Compact, scrollable navigation and a stacked home layout at 390px.</figcaption></figure><figure data-screen="9" hidden><img src="09-campaign-selector.png" alt="Campaign selector screenshot"><figcaption>The featured campaign card opens the existing campaign selector.</figcaption></figure><figure data-screen="10" hidden><img src="10-multiplayer-selector.png" alt="Multiplayer selector screenshot"><figcaption>Multiplayer remains available through its secondary card.</figcaption></figure><figure data-screen="11" hidden><img src="11-my-levels.png" alt="My levels screenshot"><figcaption>The sidebar opens the existing level manager, including from an editor.</figcaption></figure><figure data-screen="12" hidden><img src="12-my-campaigns.png" alt="My campaigns screenshot"><figcaption>The sidebar opens the existing campaign manager.</figcaption></figure><script>const select=document.getElementById('screen'),views=[...document.querySelectorAll('figure')],prev=document.getElementById('prev'),next=document.getElementById('next');function show(index){select.value=String(index);views.forEach((v,i)=>v.hidden=i!==index);prev.disabled=index===0;next.disabled=index===views.length-1;document.getElementById('count').textContent=(index+1)+' / '+views.length;}select.addEventListener('change',()=>show(Number(select.value)));prev.addEventListener('click',()=>show(Number(select.value)-1));next.addEventListener('click',()=>show(Number(select.value)+1));show(0);</script></body></html>
